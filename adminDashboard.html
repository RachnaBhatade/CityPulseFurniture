<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - City Pulse Furniture</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="nav-container"></div>
  
  <main class="admin-main">
    <div class="dashboard-header">
      <h1>Admin Dashboard</h1>
      <p>Manage your furniture inventory</p>
    </div>

    <div class="dashboard-container">
      <div class="admin-tabs">
        <button class="tab-btn active" data-tab="add">Add Product</button>
        <button class="tab-btn" data-tab="manage">Manage Products</button>
      </div>

      <!-- Add Product Tab -->
      <div class="tab-content active" id="addTab">
        <div class="form-container">
          <h2>Add New Furniture</h2>
          <form id="uploadForm">
            <div class="form-group">
              <label for="chairTitle">Product Title:</label>
              <input type="text" id="chairTitle" placeholder="Enter product title" required>
            </div>

            <div class="form-group">
              <label for="chairImage">Upload Product Image:</label>
              <input type="file" id="chairImage" accept="image/*" required>
              <div class="image-preview" id="imagePreview"></div>
            </div>

            <div class="form-group">
              <label for="chairPrice">Product Price:</label>
              <input type="text" id="chairPrice" placeholder="e.g., $100" required>
            </div>

            <div class="form-group">
              <label for="chairDescription">Product Description:</label>
              <textarea id="chairDescription" placeholder="Enter product description" rows="4" required></textarea>
            </div>

            <div class="form-group">
              <label for="chairBadge">Badge Type:</label>
              <select id="chairBadge">
                <option value="best-seller">Best Seller</option>
                <option value="new-arrival">New Arrival</option>
                <option value="classic">Classic</option>
                <option value="custom">Custom</option>
              </select>
            </div>

            <button type="submit" class="btn btn-primary">Add Product</button>
          </form>
          <div id="uploadStatus"></div>
        </div>
      </div>

      <!-- Manage Products Tab -->
      <div class="tab-content" id="manageTab">
        <div class="products-list">
          <h2>Manage Products</h2>
          <div id="productsContainer">
            <div class="loading" id="loadingProducts">Loading products...</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Edit Product Modal -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Edit Product</h2>
        <button class="modal-close" id="closeEditModal">&times;</button>
      </div>
      <form id="editForm">
        <input type="hidden" id="editId">
        <div class="form-group">
          <label>Product Title:</label>
          <input type="text" id="editTitle" required>
        </div>
        <div class="form-group">
          <label>Product Price:</label>
          <input type="text" id="editPrice" required>
        </div>
        <div class="form-group">
          <label>Product Description:</label>
          <textarea id="editDescription" rows="4" required></textarea>
        </div>
        <div class="form-group">
          <label>Badge Type:</label>
          <select id="editBadge">
            <option value="best-seller">Best Seller</option>
            <option value="new-arrival">New Arrival</option>
            <option value="classic">Classic</option>
            <option value="custom">Custom</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="adminDashboard.js"></script>
</body>
</html>
