<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Furniture Collection - City Pulse Furniture</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="furniture.css">
</head>
<body>
  <div id="nav-container"></div>
  
  <main class="furniture-main">
    <div class="furniture-header">
      <h1>Furniture Collection</h1>
      <p>Discover our curated selection of premium furniture</p>
    </div>

    <div class="filters-section">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search furniture..." />
        <span class="search-icon">🔍</span>
      </div>
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="best-seller">Best Seller</button>
        <button class="filter-btn" data-filter="new-arrival">New Arrival</button>
        <button class="filter-btn" data-filter="classic">Classic</button>
      </div>
      <div class="sort-options">
        <label for="sortSelect">Sort by:</label>
        <select id="sortSelect">
          <option value="default">Default</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
          <option value="name">Name: A to Z</option>
        </select>
      </div>
    </div>

    <div class="furniture-container" id="furnitureContainer">
      <!-- Furniture items will be dynamically loaded here -->
    </div>

    <div id="noResults" class="no-results" style="display: none;">
      <p>No furniture found matching your criteria.</p>
    </div>
  </main>

  <!-- Product Details Modal -->
  <div id="productModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Product Details</h2>
        <button class="modal-close" id="closeModal">&times;</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Product details will be loaded here -->
      </div>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="furniture.js"></script>
</body>
</html>
