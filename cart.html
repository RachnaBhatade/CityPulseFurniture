<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - City Pulse Furniture</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="cart.css">
</head>
<body>
  <div id="nav-container"></div>
  
  <main class="cart-main">
    <h1 class="cart-title">Shopping Cart</h1>
    
    <div class="cart-container">
      <div class="cart-items" id="cartItems">
        <div class="empty-cart" id="emptyCart">
          <p>Your cart is empty</p>
          <a href="furniture.html" class="btn btn-primary">Continue Shopping</a>
        </div>
      </div>
      
      <div class="cart-summary" id="cartSummary" style="display: none;">
        <h2>Order Summary</h2>
        <div class="summary-row">
          <span>Subtotal:</span>
          <span id="subtotal">$0.00</span>
        </div>
        <div class="summary-row">
          <span>Tax (10%):</span>
          <span id="tax">$0.00</span>
        </div>
        <div class="summary-row total">
          <span>Total:</span>
          <span id="total">$0.00</span>
        </div>
        <button class="btn btn-primary btn-checkout" onclick="checkout()">Proceed to Checkout</button>
        <a href="furniture.html" class="continue-shopping">Continue Shopping</a>
      </div>
    </div>
  </main>
  
  <script src="shared.js"></script>
  <script src="cart.js"></script>
</body>
</html>
